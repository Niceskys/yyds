name: combat-pace-sweep

on:
  pull_request:
    paths:
      - 'src/rules_beyond/parameter_sweep.py'
      - 'tests/test_parameter_sweep.py'
      - '.github/workflows/pace-sweep.yml'

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run 36,000-match pace sweep
        run: python -m rules_beyond.parameter_sweep --matches-per-cell 1000
