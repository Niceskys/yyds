name: dynamic-rule-replacement

on:
  pull_request:
    paths:
      - "src/rules_beyond/**"
      - "tests/**"
      - ".github/workflows/dynamic-rule-replacement.yml"
      - "docs/experiments/DYNAMIC_RULE_REPLACEMENT_2026-09-08.md"
      - "docs/handoffs/2026-09-08-dynamic-rule-controller.md"
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic dynamic-rule experiment
        run: python -m rules_beyond.dynamic_rule_experiment --matches-per-pair 500
