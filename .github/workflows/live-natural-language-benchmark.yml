name: live-natural-language-benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Zhipu model name to benchmark"
        required: true
        default: "glm-5.1"
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify API key secret exists
        shell: bash
        run: |
          if [ -z "$ZHIPU_API_KEY" ]; then
            echo "ZHIPU_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Run fixed 18-case natural-language benchmark
        shell: bash
        env:
          MODEL_NAME: ${{ inputs.model }}
        run: |
          mkdir -p benchmark-output
          python -m rules_beyond.natural_language_benchmark \
            --model "$MODEL_NAME" \
            > benchmark-output/result.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: natural-language-benchmark
          path: benchmark-output/result.json
          if-no-files-found: error
          retention-days: 30
