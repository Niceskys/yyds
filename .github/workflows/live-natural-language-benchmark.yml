name: live-natural-language-benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Live provider"
        required: true
        default: "mimo"
        type: choice
        options:
          - mimo
          - zhipu
      model:
        description: "Model name (MiMo default: mimo-v2.5-pro)"
        required: true
        default: "mimo-v2.5-pro"
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify selected provider secret exists
        shell: bash
        env:
          PROVIDER_NAME: ${{ inputs.provider }}
        run: |
          case "$PROVIDER_NAME" in
            mimo)
              if [ -z "$MIMO_API_KEY" ]; then
                echo "MIMO_API_KEY repository secret is not configured."
                exit 1
              fi
              ;;
            zhipu)
              if [ -z "$ZHIPU_API_KEY" ]; then
                echo "ZHIPU_API_KEY repository secret is not configured."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported provider."
              exit 1
              ;;
          esac

      - name: Run fixed 18-case natural-language benchmark
        shell: bash
        env:
          PROVIDER_NAME: ${{ inputs.provider }}
          MODEL_NAME: ${{ inputs.model }}
        run: |
          mkdir -p benchmark-output
          python -m rules_beyond.natural_language_benchmark \
            --provider "$PROVIDER_NAME" \
            --model "$MODEL_NAME" \
            > benchmark-output/result.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: natural-language-benchmark
          path: benchmark-output/result.json
          if-no-files-found: error
          retention-days: 30
