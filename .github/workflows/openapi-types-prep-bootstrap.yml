name: openapi-types-prep-bootstrap

on:
  push:
    branches:
      - frontend/openapi-types-prep-v02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: frontend/openapi-types-prep-v02

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Update lockfile for exact generator dependency
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Generate TypeScript contract
        run: npm run contract:generate

      - name: Audit dependency state
        run: npm audit --json || true

      - name: Commit generated assets when changed
        shell: bash
        run: |
          cd ..
          if git diff --quiet -- web/package-lock.json web/src/contract/generated/api.ts; then
            echo "Generated assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json web/src/contract/generated/api.ts
          git commit -m "build(frontend): generate V0.2 OpenAPI TypeScript contract" -m "Generated with openapi-typescript 7.13.0 from contracts/openapi/mvp-v0.2.json."
          git push origin HEAD:frontend/openapi-types-prep-v02
