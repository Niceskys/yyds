name: live-agent-planner-match (historical V0.1 PASS)

# HISTORICAL-ONLY REPRODUCTION ENTRY.
#
# Frozen Agent / Planner Integration Gate V0.1 PASS:
#   run_id: 34186823597
#   head:   5c1aeccc7d9ef1727c01f416695415f5a9c9477f
#   evidence: docs/experiments/LIVE_AGENT_PLANNER_GATE_PASS_2026-09-08.md
#
# This workflow deliberately checks out that frozen commit so the historical
# Gate definition can never be replaced by the current V0.2 intermission
# cadence. Current cadence Gate: .github/workflows/live-agent-planner-match-v02.yml
on:
  workflow_dispatch:
    inputs:
      model:
        description: "MiMo strategy model name"
        required: true
        default: "mimo-v2.5-pro"
        type: string

jobs:
  live-agent-planner-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c1aeccc7d9ef1727c01f416695415f5a9c9477f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify MiMo Token Plan secret exists
        shell: bash
        run: |
          if [ -z "$MIMO_API_KEY" ]; then
            echo "MIMO_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Run historical Agent Planner Gate V0.1
        id: live
        continue-on-error: true
        shell: bash
        env:
          MODEL_NAME: ${{ inputs.model }}
        run: |
          mkdir -p live-agent-output
          python -m rules_beyond.live_agent_planner_match \
            --model "$MODEL_NAME" \
            > live-agent-output/result.json

      - name: Upload Agent Planner trace
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-planner-match
          path: live-agent-output/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Agent Planner Gate result
        if: steps.live.outcome != 'success'
        run: exit 1
