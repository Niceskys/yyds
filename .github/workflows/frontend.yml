name: frontend

on:
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'contracts/fixtures/mvp-v0.2/**'
      - 'contracts/openapi/mvp-v0.2.json'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'contracts/fixtures/mvp-v0.2/**'
      - 'contracts/openapi/mvp-v0.2.json'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: contract-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check generated OpenAPI contract
        run: npm run contract:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
