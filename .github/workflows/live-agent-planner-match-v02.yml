name: live-agent-planner-match-v02 (current V0.2 cadence)

# Current-cadence Agent / Planner connectivity Gate.
# This is a NEW Gate for the V0.2 intermission state machine, not a rerun of the
# frozen Agent / Planner Integration Gate V0.1 PASS
# (head 5c1aeccc7d9ef1727c01f416695415f5a9c9477f).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "MiMo strategy model name"
        required: true
        default: "mimo-v2.5-pro"
        type: string

jobs:
  live-agent-planner-match-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify MiMo Token Plan secret exists
        shell: bash
        run: |
          if [ -z "$MIMO_API_KEY" ]; then
            echo "MIMO_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Run current-cadence Agent Planner Gate V0.2
        id: live
        continue-on-error: true
        shell: bash
        env:
          MODEL_NAME: ${{ inputs.model }}
        run: |
          mkdir -p live-agent-output
          python -m rules_beyond.live_agent_planner_match_v02 \
            --model "$MODEL_NAME" \
            > live-agent-output/result.json

      - name: Upload Agent Planner trace
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-planner-match-v02
          path: live-agent-output/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Agent Planner Gate result
        if: steps.live.outcome != 'success'
        run: exit 1
