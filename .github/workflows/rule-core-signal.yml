name: rule-core-signal

on:
  pull_request:
    paths:
      - 'src/rules_beyond/rule_bots.py'
      - 'src/rules_beyond/rule_experiment.py'
      - 'src/rules_beyond/rule_engine.py'
      - 'src/rules_beyond/rule_runtime.py'
      - 'tests/test_rule_experiment.py'
      - '.github/workflows/rule-core-signal.yml'

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run paired-seed public-rule experiment
        run: python -m rules_beyond.rule_experiment --matches-per-cell 1000
