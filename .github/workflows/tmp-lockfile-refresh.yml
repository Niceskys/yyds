# TEMPORARY bootstrap workflow for Issue #45 (frontend/npm-audit-v02).
#
# Why it exists:
#   The dependency patch upgrade (vite 5.4.11 -> 5.4.21, vitest 2.1.8 -> 2.1.9)
#   requires a regenerated web/package-lock.json. The AI workspace could not
#   push the ~111 KB lockfile through the GitHub contents API tool, so this
#   one-shot workflow regenerates it on a GitHub runner and commits it back.
#
# This file is deleted in the same pull request before review. The final PR
# diff contains no CI change.
name: tmp-lockfile-refresh

on:
  push:
    branches:
      - frontend/npm-audit-v02
    paths:
      - 'web/package.json'

permissions:
  contents: write

concurrency:
  group: tmp-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: regenerate-package-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate lockfile
        working-directory: web
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already in sync; nothing to commit"
          else
            git commit -m "chore(frontend): regenerate package-lock after npm audit patch upgrades"
            git push origin HEAD:${{ github.ref_name }}
          fi
