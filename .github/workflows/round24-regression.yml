name: round24-regression

on:
  pull_request:
    paths:
      - 'src/rules_beyond/model.py'
      - 'src/rules_beyond/engine.py'
      - 'src/rules_beyond/rule_engine.py'
      - 'src/rules_beyond/rule_experiment.py'
      - 'src/rules_beyond/round24_regression.py'
      - 'tests/test_liveness.py'
      - 'tests/test_rule_engine.py'
      - '.github/workflows/round24-regression.yml'
      - 'docs/P0_RULE_FREEZE_V0.1_ROUND24_AMENDMENT.md'
      - 'docs/handoffs/2026-09-08-round24-normative.md'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run normative Round-24 exploit regression
        run: python -m rules_beyond.round24_regression --matches-per-cell 1000
