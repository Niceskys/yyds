name: openapi-snapshot-bootstrap

on:
  push:
    branches:
      - shared/openapi-snapshot-v02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: shared/openapi-snapshot-v02

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: python -m pip install -e .

      - name: Generate canonical OpenAPI snapshot
        run: python -m rules_beyond.openapi_contract --output contracts/openapi/mvp-v0.2.json

      - name: Commit generated snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- contracts/openapi/mvp-v0.2.json && git ls-files --error-unmatch contracts/openapi/mvp-v0.2.json >/dev/null 2>&1; then
            echo "OpenAPI snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi/mvp-v0.2.json
          git commit -m "build(contracts): generate V0.2 OpenAPI snapshot" -m "Generated from src/rules_beyond/openapi_contract.py; do not hand-edit."
          git push origin HEAD:shared/openapi-snapshot-v02
