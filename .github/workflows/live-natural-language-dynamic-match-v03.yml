name: live-natural-language-dynamic-match-v03 (current V0.2 cadence)

# Current-cadence natural-language dynamic match Gate.
# This is a NEW Gate for the V0.2 intermission state machine, not a rerun of the
# frozen Natural-Language Dynamic Match Gate V0.1 (FAIL, head 9239cfa...) or
# V0.2 (FAIL, head 62a1ec5...).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "MiMo model name"
        required: true
        default: "mimo-v2.5-pro"
        type: string

jobs:
  live-dynamic-match-v03:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify MiMo Token Plan secret exists
        shell: bash
        run: |
          if [ -z "$MIMO_API_KEY" ]; then
            echo "MIMO_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Run current-cadence V0.3 natural-language dynamic match gate
        id: live
        continue-on-error: true
        shell: bash
        env:
          MODEL_NAME: ${{ inputs.model }}
        run: |
          mkdir -p live-match-output
          python -m rules_beyond.live_natural_language_dynamic_match_v03 \
            --model "$MODEL_NAME" \
            > live-match-output/result.json

      - name: Upload V0.3 live match trace
        uses: actions/upload-artifact@v4
        with:
          name: live-natural-language-dynamic-match-v03
          path: live-match-output/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce V0.3 live gate result
        if: steps.live.outcome != 'success'
        run: exit 1
