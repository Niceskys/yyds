[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-beyond"
version = "0.1.0"
description = "Deterministic engine prototype for Rules Beyond"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
